<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eeshan</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23222'/><text x='50' y='68' font-family='Georgia,serif' font-size='60' font-style='italic' fill='%23f5f5f5' text-anchor='middle'>e</text></svg>">
    <link rel="stylesheet" href="style.css">
    <script>if(localStorage.getItem('theme-eeshan')!=='light')document.documentElement.className='dark'</script>
</head>
<body class="home-page">
    <header class="page-header">
        <h1>eeshan</h1>
            <button class="theme-btn" aria-label="Toggle colour theme"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="var(--theme-toggle-fill)"/></svg></button>
    </header>
    <main>
        <p class="home-intro">A place to keep track of what I’m making, trying, and thinking about. Mostly for my own record, but you’re welcome to look around.</p>
        <div id="project-filters" class="project-filters" role="group" aria-label="Filter projects by tag"></div>
        <ul id="projects" class="category-list" aria-live="polite"></ul>
    </main>
    <script>
        // Add projects here: { name, url, tags: ["tag-name"] }
        var projects = [
            { name: "BenchmarkBench", url: "/benchmarkbench", tags: ["AI", "LLM", "benchmarks"] },
            { name: "Cadence", url: "https://github.com/OhLookCake/cadence", tags: ["MacOS", "utility", "scheduling"] },
            { name: "Viberuary", url: "https://viberuary.pages.dev", tags: ["AI", "vibe-coding"] },
            { name: "Jolie Guacamole", url: "games/jolie-guacamole", tags: ["games", "social-games"] },
            { name: "Frequency", url: "games/frequency", tags: ["games", "social-games"] },
            { name: "Backtrack", url: "games/backtrack", tags: ["games", "social-games"] },
            { name: "Venn in Doubt", url: "games/venn-in-doubt", tags: ["games", "social-games"] },
            { name: "Vibe Who", url: "games/vibewho", tags: ["games", "social-games"] },
            { name: "Startups Against Humanity", url: "games/startups-against-humanity", tags: ["games", "social-games"] },
            { name: "Cross Section", url: "games/cross-section", tags: ["games", "1p-games"] },
            { name: "1D Chess", url: "games/1d-chess", tags: ["games", "1p-games"] },
            { name: "Countdown Letters", url: "games/letters-practice", tags: ["games", "1p-games"] },
            { name: "Hodorle", url: "games/hodorle", tags: ["games", "1p-games"] },
        ];

        var container = document.getElementById('projects');
        var filters = document.getElementById('project-filters');
        var filterTags = ['AI', 'LLM', 'MacOS', 'utility', 'vibe-coding', 'games', 'social-games', '1p-games'];

        function renderProjects(tag) {
            container.replaceChildren();
            projects.filter(function(project) {
                return tag === null || project.tags.includes(tag);
            }).forEach(function(project) {
                var item = document.createElement('li');
                var link = document.createElement('a');
                link.href = project.url;
                link.textContent = project.name;
                item.appendChild(link);
                container.appendChild(item);
            });
        }

        [null].concat(filterTags).forEach(function(tag) {
            var button = document.createElement('button');
            button.type = 'button';
            button.textContent = tag === null ? 'All' : tag;
            button.setAttribute('aria-pressed', String(tag === null));
            button.addEventListener('click', function() {
                var selectedTag = button.getAttribute('aria-pressed') === 'true' ? null : tag;
                filters.querySelectorAll('button').forEach(function(filter) {
                    var selectedButton = selectedTag === null ? filters.firstElementChild : button;
                    filter.setAttribute('aria-pressed', String(filter === selectedButton));
                });
                renderProjects(selectedTag);
            });
            filters.appendChild(button);
        });

        renderProjects(null);
    </script>
    <script src="theme.js"></script>
    <script data-goatcounter="https://cakester.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
